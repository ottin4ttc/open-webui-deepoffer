version: '3.8'
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-webui-sms:latest
    container_name: open-webui
    depends_on:
      - redis
    ports:
      - "3000:8080"
    env_file:
      - .env
    restart: unless-stopped